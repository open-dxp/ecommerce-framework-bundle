services:
    _defaults:
        public: false
        autowire: true
        autoconfigure: true
    #
    # PRODUCT INDEX CONFIGS AND WORKERS
    #
    # Defined in an extra file as we can't define parent/child definitions in a file with _defaults

    #
    # CONFIGURATIONS
    #
    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\AttributeFactory:
        arguments:
            $getters: '@opendxp_ecommerce.locator.index_service.getters'
            $interpreters: '@opendxp_ecommerce.locator.index_service.interpreters'

    # abstract configuration definition - arguments will be injected from configuration values
    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\AbstractConfig:
        abstract: true
        arguments:
            $tenantName: ~
            $attributeFactory: '@OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\AttributeFactory'

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\DefaultMysql:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\AbstractConfig

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\DefaultMysqlSubTenantConfig:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\AbstractConfig
        arguments:
            $environment: '@opendxp_ecommerce.environment'
            $db: '@doctrine.dbal.default_connection'

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\OptimizedMysql:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\AbstractConfig

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\ElasticSearch:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\AbstractConfig

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\DefaultFindologic:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\AbstractConfig

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\OpenSearch:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Config\AbstractConfig

    #
    # WORKERS
    #

    # abstract worker definition - arguments will be injected from configuration values
    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\AbstractWorker:
        abstract: true
        arguments:
            $tenantConfig: ~ # will be injected from configuration
            $db: '@doctrine.dbal.default_connection'

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\DefaultMysql:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\AbstractWorker

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\OptimizedMysql:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\AbstractWorker

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\ElasticSearch\DefaultElasticSearch8:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\AbstractWorker

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\DefaultFindologic:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\AbstractWorker

    OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\OpenSearch\DefaultOpenSearch:
        parent: OpenDxp\Bundle\EcommerceFrameworkBundle\IndexService\Worker\AbstractWorker
